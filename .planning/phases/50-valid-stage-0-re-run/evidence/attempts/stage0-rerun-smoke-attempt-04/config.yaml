data:
  blacklist_path: ../Documentation/problematic_ics_blacklist.json
  root: null
  source: admitted
loss:
  lambda_e_max: 0.0
opt:
  adam_betas:
  - 0.9
  - 0.999
  adam_eps: 1.0e-08
  adam_lr_base: 0.001
  adam_lr_decay: 0.7
  lbfgs_chunk_size: 1024
  lbfgs_history_size: 10
  lbfgs_line_search: strong_wolfe
  lbfgs_max_iter: 20
  validation_every: 100
run:
  checkpoint:
    every_n_steps: 100
    failure_keep: 10
    rolling_keep: 4
    wall_clock_ceiling_s: 3600.0
  device: mps
  guards:
    disk_floor_fraction: 0.05
    loss_explosion_ceiling: 100000000000.0
    memory_watermark_fraction: 0.7
  invariants:
    front_advance_window_n: 500
  log_every: 50
  monitor:
    heartbeat_secs: 30
    mem_every: 100
    staleness_factor: 3
    tb_histogram_every: 100
  precision: float32
  recover_retries: 0
  run_name: stage0-rerun-smoke
  seed: 42
  smoke: true
  strict_cpu_determinism: false
stage:
  beta: 0.98
  energy_floor_factor: 0.0001
  eps_energy: 0.0001
  eps_phys: 0.0001
  eps_plateau: 1.0e-05
  max_epochs: 300
  n_adam: 300
  patience: 200
  percentile_10_relaxation: 0.1
  replay_count: 32
  stagnation_window: 10000
